[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-pylan"
version = "0.0.2"
description = "Cross-platform local network file and data sharing library."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Aryan Vishwakarma", email = "aryanvishwakarma275@gmail.com" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.5.0",
    "pytest>=9.1.1",
]

[project.scripts]
pylan = "pylan.main:main"

[project.urls]
Homepage = "https://github.com/Aryan-202/python-pylan"

[tool.hatch.build.targets.wheel]
packages = ["pylan"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
