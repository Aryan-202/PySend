[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-pylan"
version = "0.0.2"
description = "Cross-platform local network file and data sharing library."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Aryan Vishwakarma", email = "aryanvishwakarma275@gmail.com" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "asyncio>=4.0.0",
    "bleak>=3.0.2",
    "certifi>=2026.10.23",
    "click>=8.5.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "qrcode>=8.2",
    "scapy>=2.8.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
pylan = "pylan.main:main"

[project.urls]
Homepage = "https://github.com/Aryan-202/python-pylan"

[tool.hatch.build.targets.wheel]
packages = ["pylan"]

[tool.mypy]
python_version = "3.10"
files = ["pylan"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
