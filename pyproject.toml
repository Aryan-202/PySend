[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysend"
version = "0.0.1"
description = "Fast, secure local network file sharing library and CLI."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aryan Vishwakarma" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Aryan-202/pysend"