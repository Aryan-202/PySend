[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-pylan"
version = "0.0.1"
description = "Cross-platform local network file and data sharing library."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aryan Vishwakarma" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Aryan-202/python-pylan"

[tool.hatch.build.targets.wheel]
packages = ["pylan"]